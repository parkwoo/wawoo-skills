site_name: wawoo-skills
site_url: https://parkwoo.github.io/wawoo-skills/
site_description: >-
  Invocation by design — a reusable kit of skills / agents / workflows / MCP
  servers for AI coding agents, so the same request takes the same steps.
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - i18n:
      docs_structure: suffix      # NAME.md (en) / NAME.ja.md (ja) -> language switcher + per-language nav
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
        - locale: ja
          name: 日本語
          nav_translations:
            Home: ホーム
            Usage: 使い方
            Intent routing: 意図ルーティング
            Versioning: バージョン管理

# The docs intentionally link to the other language as `NAME.ja.md` (so GitHub
# navigation stays in the reader's language). Those sibling-language links are
# not separate pages in the i18n build, so ignore only the link-target warning.
validation:
  links:
    not_found: ignore
    absolute_links: ignore

exclude_docs: |
  memory/
  plans/

nav:
  - Home: index.md
  - Usage: USAGE.md
  - Intent routing: INTENT-ROUTING.md
  - Versioning: VERSIONING.md
