# 実測環境（段階的）
#   docker compose -f docker/e2e/docker-compose.yml run --rm smoke
#   docker compose -f docker/e2e/docker-compose.yml run --rm kilo-cli kilo --version
services:
  smoke:
    build:
      context: ../..
      dockerfile: docker/e2e/Dockerfile.smoke
    image: wawoo-skills-e2e-smoke:local

  kilo-cli:
    build:
      context: .
      dockerfile: Dockerfile.kilo
    image: wawoo-skills-kilo-cli:local
    working_dir: /work
    volumes:
      - ../..:/work
    # 認証はホストの ~/.config/kilo 等をマウントするか、実行時に kilo auth
    # env_file: ../../.env
