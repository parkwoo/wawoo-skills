name: validate

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  assets-and-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: validate_assets.py
        run: python3 scripts/validate_assets.py
      - name: e2e_flows.py
        run: python3 scripts/e2e_flows.py
      - name: cli_adapters_mock.py
        run: python3 scripts/cli_adapters_mock.py
